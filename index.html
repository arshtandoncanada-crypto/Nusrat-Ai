<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusrat Ai - Paraphraser</title>
    <style>
        /* Modern QuillBot-Style CSS */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #10b981; /* Fresh Emerald Green */
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        .editor-wrapper {
            display: flex;
            background: #ffffff;
            width: 100%;
            max-width: 1100px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            overflow: hidden;
            position: relative;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .pane:first-child {
            border-right: 1px solid #e5e7eb;
        }
        textarea {
            width: 100%;
            height: 350px;
            padding: 24px;
            border: none;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            color: #374151;
        }
        textarea::placeholder {
            color: #9ca3af;
        }
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Mobile friendly: stack them on small screens */
        @media (max-width: 768px) {
            .editor-wrapper {
                flex-direction: column;
            }
            .pane:first-child {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
            .button-container {
                bottom: auto;
                top: 50%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>

    <h1>Nusrat Ai</h1>

    <div class="editor-wrapper">
        <div class="pane">
            <textarea id="inputText" placeholder="Paste your text here to paraphrase..."></textarea>
        </div>
        
        <div class="button-container">
            <button id="paraphraseBtn">Paraphrase</button>
        </div>

        <div class="pane">
            <textarea id="outputText" placeholder="Your modern, polished text will appear here..." readonly></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
